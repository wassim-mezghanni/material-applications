name: Release express-app

on:
  push:
    branches:
      - main
    paths:
      - 'express-app/**'
      - '.github/workflows/express-app.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Downcase Docker Hub username
        run: |
          echo "DOCKERHUB_USERNAME_LC=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: express-app
          file: express-app/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME_LC }}/express-app:latest
          platforms: linux/amd64,linux/arm64

      - name: Trigger Render Deploy Hook
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
